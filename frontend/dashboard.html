<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Tableau de bord - Planning Intelligent</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .nav-menu {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            background: rgba(255,255,255,0.15);
            padding: 10px 15px;
            border-radius: 12px;
        }
        .nav-menu .btn {
            padding: 8px 18px;
            font-size: 13px;
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            font-weight: 500;
        }
        .nav-menu .btn:hover {
            background: rgba(255,255,255,0.35);
            transform: translateY(-2px);
        }
        .nav-menu .btn.active {
            background: white;
            color: #667eea;
            border-color: white;
        }
        .btn-connexion {
            background: #e74c3c;
            border-color: #e74c3c;
            color: white;
        }
        .btn-connexion:hover {
            background: #c0392b;
            border-color: #c0392b;
        }

        /* Hamburger */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            padding: 8px;
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            margin-left: auto;
        }
        .hamburger span {
            width: 25px;
            height: 3px;
            background: white;
            margin: 3px 0;
            border-radius: 3px;
            transition: 0.3s;
        }
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .nav-menu {
            transition: all 0.3s ease;
        }
        .nav-menu.open {
            display: flex !important;
        }

        @media (min-width: 769px) {
            .nav-menu {
                display: flex !important;
            }
            .hamburger {
                display: none !important;
            }
        }

        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }
            .nav-menu {
                display: none;
                flex-direction: column;
                width: 100%;
                background: rgba(26, 26, 46, 0.95);
                border-radius: 12px;
                padding: 15px;
                margin-top: 10px;
                gap: 8px;
            }
            .nav-menu .btn {
                width: 100%;
                text-align: center;
                padding: 14px 20px;
                font-size: 15px;
                background: rgba(255,255,255,0.08);
                border: 1px solid rgba(255,255,255,0.1);
            }
            .dashboard-stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .quick-actions {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card .icon {
            font-size: 2.5em;
            display: block;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.2em;
            font-weight: bold;
            color: #2d3436;
        }

        .stat-card .label {
            color: #636e72;
            font-size: 14px;
            margin-top: 5px;
        }

        .stat-card.blue .value { color: #667eea; }
        .stat-card.green .value { color: #00b894; }
        .stat-card.orange .value { color: #fdcb6e; }
        .stat-card.red .value { color: #ff6b6b; }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .quick-action {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: #2d3436;
            border: 2px solid transparent;
        }

        .quick-action:hover {
            border-color: #667eea;
            transform: scale(1.03);
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .quick-action .icon {
            font-size: 2em;
            display: block;
            margin-bottom: 8px;
        }

        .quick-action .label {
            font-size: 13px;
            color: #636e72;
        }

        @media (max-width: 480px) {
            .dashboard-stats {
                grid-template-columns: 1fr;
            }
            .quick-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>📊 Tableau de bord</h1>
            <p>Vue d'ensemble de votre progression et planning</p>
            
            <!-- MENU DE NAVIGATION AVEC HAMBURGER -->
            <div style="display:flex; align-items:center; flex-wrap:wrap; width:100%;">
                <div class="hamburger" onclick="toggleMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="nav-menu" id="navMenu">
                    <button class="btn" onclick="window.location.href='index.html'">🏠 Accueil</button>
                    <button class="btn" onclick="window.location.href='emploi.html'">📖 Emploi du temps</button>
                    <button class="btn" onclick="window.location.href='matieres.html'">📚 Mes matières</button>
                    <button class="btn" onclick="window.location.href='planning.html'">📅 Mon planning</button>
                    <button class="btn active" onclick="window.location.href='dashboard.html'">📊 Tableau de bord</button>
                    <button class="btn btn-success" onclick="window.location.href='index.html'">👤 Nouvel utilisateur</button>
                    <button class="btn btn-connexion" id="btnConnexion">🔐 Connexion</button>
                </div>
            </div>

            <div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;">
                <input type="text" id="userId" placeholder="Votre ID utilisateur" style="padding:8px 12px; border:2px solid #dfe6e9; border-radius:8px; flex:1; min-width:150px;">
                <button class="btn" id="btnCharger">🔍 Charger</button>
            </div>
        </div>

        <!-- STATISTIQUES -->
        <div class="dashboard-stats" id="statsContainer">
            <div class="stat-card blue">
                <span class="icon">📖</span>
                <div class="value" id="nbCours">0</div>
                <div class="label">Cours</div>
            </div>
            <div class="stat-card green">
                <span class="icon">🧹</span>
                <div class="value" id="nbTaches">0</div>
                <div class="label">Tâches</div>
            </div>
            <div class="stat-card orange">
                <span class="icon">✅</span>
                <div class="value" id="tachesTerminees">0</div>
                <div class="label">Tâches terminées</div>
            </div>
            <div class="stat-card red">
                <span class="icon">📈</span>
                <div class="value" id="tauxCompletion">0%</div>
                <div class="label">Taux de complétion</div>
            </div>
        </div>

        <!-- ACTIONS RAPIDES -->
        <div style="background:white; border-radius:15px; padding:25px; margin-top:25px; box-shadow:0 3px 10px rgba(0,0,0,0.08);">
            <h3 style="margin-bottom:15px; color:#2d3436;">⚡ Actions rapides</h3>
            <div class="quick-actions">
                <a href="emploi.html" class="quick-action">
                    <span class="icon">📖</span>
                    <span class="label">Ajouter un cours</span>
                </a>
                <a href="index.html#taches" class="quick-action">
                    <span class="icon">🧹</span>
                    <span class="label">Ajouter une tâche</span>
                </a>
                <a href="planning.html" class="quick-action">
                    <span class="icon">📅</span>
                    <span class="label">Voir mon planning</span>
                </a>
                <a href="javascript:void(0)" onclick="optimiser()" class="quick-action">
                    <span class="icon">🚀</span>
                    <span class="label">Optimiser maintenant</span>
                </a>
            </div>
        </div>

        <!-- MESSAGE DE BIENVENUE -->
        <div id="welcomeMessage" style="background:white; border-radius:15px; padding:25px; margin-top:20px; box-shadow:0 3px 10px rgba(0,0,0,0.08); text-align:center;">
            <p style="color:#636e72;">👤 Connectez-vous pour voir vos statistiques détaillées</p>
        </div>

        <div id="notification" style="margin-top:20px; padding:15px; border-radius:10px; display:none; text-align:center; font-weight:500;"></div>
    </div>

    <script src="js/api.js"></script>
    <script>
        let utilisateurId = localStorage.getItem('userId') || '';

        function afficherNotification(message, type) {
            const el = document.getElementById('notification');
            el.textContent = message;
            el.style.display = 'block';
            const colors = { success: '#d4edda', warning: '#fff3cd', error: '#f8d7da', info: '#d1ecf1' };
            const textColors = { success: '#155724', warning: '#856404', error: '#721c24', info: '#0c5460' };
            el.style.backgroundColor = colors[type] || colors.info;
            el.style.color = textColors[type] || textColors.info;
            setTimeout(() => el.style.display = 'none', 4000);
        }

        async function chargerStats() {
            const userId = document.getElementById('userId').value.trim() || utilisateurId;
            if (!userId) {
                afficherNotification('⚠️ Veuillez entrer un ID utilisateur', 'warning');
                return;
            }
            utilisateurId = userId;
            localStorage.setItem('userId', userId);

            try {
                // ✅ Utiliser window.API_BASE
                const data = await ApiClient.getStats(userId);
                if (data.success) {
                    const stats = data.stats;
                    document.getElementById('nbCours').textContent = stats.total_cours || 0;
                    document.getElementById('nbTaches').textContent = stats.total_taches || 0;
                    document.getElementById('tachesTerminees').textContent = stats.taches_terminees || 0;
                    document.getElementById('tauxCompletion').textContent = (stats.taux_completion || 0) + '%';

                    document.getElementById('welcomeMessage').innerHTML = `
                        <p style="color:#2d3436; font-weight:500;">✅ Bienvenue ${data.utilisateur?.nom || 'Étudiant'} !</p>
                        <p style="color:#636e72; font-size:14px;">Vous avez ${stats.total_taches || 0} tâches à gérer</p>
                    `;
                    afficherNotification('✅ Données chargées avec succès !', 'success');
                }
            } catch (error) {
                afficherNotification('❌ Erreur: ' + error.message, 'error');
            }
        }

        async function optimiser() {
            const userId = document.getElementById('userId').value.trim() || utilisateurId;
            if (!userId) {
                afficherNotification('⚠️ Veuillez charger un utilisateur', 'warning');
                return;
            }

            try {
                // ✅ Utiliser window.API_BASE
                const data = await ApiClient.optimiser(userId);
                if (data.success) {
                    afficherNotification('✅ Planning optimisé ! ' + (data.plan ? data.plan.length : 0) + ' tâches', 'success');
                    window.location.href = 'planning.html';
                }
            } catch (error) {
                afficherNotification('❌ Erreur: ' + error.message, 'error');
            }
        }

        document.getElementById('btnCharger').addEventListener('click', chargerStats);

        if (utilisateurId) {
            document.getElementById('userId').value = utilisateurId;
            chargerStats();
        }
    </script>

    <script>
        function toggleMenu() {
            const navMenu = document.getElementById('navMenu');
            const hamburger = document.querySelector('.hamburger');
            if (navMenu) {
                navMenu.classList.toggle('open');
                if (hamburger) hamburger.classList.toggle('active');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const navMenu = document.getElementById('navMenu');
            if (navMenu) {
                navMenu.querySelectorAll('.btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        navMenu.classList.remove('open');
                        const hamburger = document.querySelector('.hamburger');
                        if (hamburger) hamburger.classList.remove('active');
                    });
                });
            }
            if (window.mettreAJourMenuConnexion) {
                window.mettreAJourMenuConnexion();
            }
        });
    </script>
</body>
</html>
